<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

  button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 13px;font-size:13.5px;font-weight:700;border:none;white-space:nowrap}
  .btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:#5b21b6}.btn-p:disabled{opacity:.6}
  .btn-g{background:#fff;color:#3a3f4b;border:1px solid var(--line)}.btn-g:hover{background:#f3f4f7}

  .btn-s{font-size:11px;padding:4px 8px;border-radius:6px}
  .input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:13.5px;outline:none;background:#fff}
  .input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--soft)}
  .input.sm{padding:4px 7px;font-size:12.5px;border-radius:6px}
  label.lb{display:block;font-size:12.5px;font-weight:600;color:#3a3f4b;margin:0 0 4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px}
  .badge{display:inline-flex;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;line-height:1.6}
  .b-idea{background:#f1f2f5;color:#555}.b-research{background:#fef3c7;color:#92660b}.b-tovalidate{background:#fde68a;color:#854d0e}.b-sourcing{background:#dbeafe;color:#1d4ed8}.b-workshop{background:#cffafe;color:#155e75}.b-testing{background:#ede9fe;color:#6d28d9}.b-validated{background:#dcfce7;color:#15803d}.b-production{background:#bbf7d0;color:#166534}.b-scaling{background:#86efac;color:#14532d}.b-video{background:#fce7f3;color:#9d174d}.b-live{background:#a7f3d0;color:#064e3b}.b-killed{background:#fee2e2;color:#b91c1c}
  .b-todo{background:#f1f2f5;color:#555}.b-doing{background:#dbeafe;color:#1d4ed8}.b-done{background:#dcfce7;color:#15803d}
  .pri-low{background:#f1f2f5;color:#666}.pri-normal{background:#dbeafe;color:#1d4ed8}.pri-high{background:#fef3c7;color:#92660b}.pri-urgent{background:#fee2e2;color:#b91c1c}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(140deg,#5b21b6,#7c3aed,#10142a)}
  .login .box{width:100%;max-width:400px}
  .login .head{text-align:center;color:#fff;margin-bottom:18px}
  .login .logo{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
  .login h1{font-size:24px}.login .sub{color:rgba(255,255,255,.8);font-size:14px;margin-top:3px}
  .login .form{background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login h2{font-size:18px;margin-bottom:16px}.login .row{margin-bottom:13px}
  .link{background:none;border:none;color:var(--brand);font-weight:700;font-size:14px;width:100%;margin-top:14px}
  .err{background:#fee2e2;color:#b91c1c;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px}
  .info{background:#e0f2fe;color:#075985;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px}
  .ok{background:var(--good-bg);color:var(--good);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px}
  .langtop{position:fixed;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:9px;padding:7px 12px;font-weight:800;font-size:13px}
  .shell{display:flex;min-height:100vh}
  .side{width:230px;flex:none;background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
  .side.mob{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 9px 14px}
  .brand .lg{width:32px;height:32px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .brand b{font-size:16px;font-weight:800}
  .nav{display:flex;flex-direction:column;gap:1px;flex:1}
  .nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:#3a3f4b;text-decoration:none;cursor:pointer}
  .nav a:hover{background:#f3f4f7}.nav a.on{background:var(--soft);color:var(--brand)}.nav a .ic{width:16px;text-align:center;font-size:14px}
  .nav .sep{font-size:10px;text-transform:uppercase;color:#9ca3af;font-weight:800;letter-spacing:.06em;padding:10px 11px 4px;letter-spacing:.05em}
  .nav a .cnt{margin-inline-start:auto;background:#f1f2f5;color:#555;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
  .nav a.on .cnt{background:#e9e0fb;color:var(--brand)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:9px 16px}
  .top .sp{flex:1}.burger{display:none;background:none;border:none;font-size:22px;color:#3a3f4b}
  .who{display:flex;align-items:center;gap:8px}
  .who .nm{font-size:12.5px;font-weight:700;line-height:1.2;text-align:end}.who .rl{font-size:10.5px;color:var(--ink2)}
  .who .av{width:32px;height:32px;border-radius:50%;background:#e9e0fb;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .gsearch{background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;outline:none;width:220px}
  .gsearch:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--soft);background:#fff}
  .content{padding:18px 16px;overflow:auto;flex:1}.inner{max-width:1280px;margin:0 auto}
  h1.pg{font-size:22px;font-weight:800;letter-spacing:-.01em}.sub{color:var(--ink2);font-size:13.5px;margin-top:2px}
  .pghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
  .pghead .acts{display:flex;gap:6px;flex-wrap:wrap}
  .grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
  .stat{padding:15px}.stat .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:9px;font-size:17px}
  .stat .v{font-size:26px;font-weight:800;line-height:1.1}.stat .l{font-size:12.5px;color:var(--ink2);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8f9fb;text-align:start;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #f1f2f5;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.row-hover:hover td{background:#fbfaff}
  .scroll-x{overflow-x:auto;max-width:100%}
  .kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
  .col{width:230px;flex:none;border-radius:11px;padding:5px;transition:.15s;background:transparent}
  .col.over{background:var(--soft);box-shadow:inset 0 0 0 2px #d4c4f7}
  .col .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:0 4px}
  .kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;cursor:grab;transition:.1s}
  .kc:hover{border-color:#d4c4f7;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .kc.drag{opacity:.45}
  .kc .t{font-weight:700;font-size:13px;line-height:1.3}.kc .m{font-size:11.5px;color:var(--ink2);margin-top:3px}
  .kc img{width:100%;height:80px;object-fit:cover;border-radius:7px;margin-bottom:6px}
  .kc .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:80}

  .modal .bx.lg{max-width:880px}

  .row2{display:flex;gap:9px;flex-wrap:wrap}.row2>div{flex:1;min-width:130px}
  .demo{background:var(--navy);color:#9ff0c4;font-size:11.5px;text-align:center;padding:5px}
  a.tile{color:inherit;text-decoration:none;display:block;cursor:pointer}
  .note{font-size:11.5px;color:var(--ink2);margin-bottom:8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center{display:flex;align-items:center;justify-content:center;min-height:60vh}
  /* Star rating */
  .stars{display:inline-flex;gap:2px}
  .stars button{background:none;border:none;font-size:18px;line-height:1;color:#d1d5db;padding:0;cursor:pointer;transition:.1s}
  .stars button.on{color:#f59e0b}.stars button:hover{color:#fbbf24}
  .stars.sm button{font-size:13px}
  /* Score chip */
  .score-chip{display:inline-flex;align-items:center;gap:3px;background:#fff7ed;color:#b45309;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:800}
  .score-chip.hi{background:var(--good-bg);color:var(--good)}
  .score-chip.med{background:#fef9c3;color:#854d0e}
  .score-chip.lo{background:var(--bad-bg);color:var(--bad)}

  .sheet-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 220px)}
  .sheet-tbl{border-collapse:collapse;font-size:12px;min-width:max-content}
  .sheet-tbl th{background:#1e293b;color:#e2e8f0;text-align:start;padding:7px 9px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-right:1px solid #334155;position:sticky;top:0;z-index:5;white-space:nowrap}
  .sheet-tbl th:first-child{position:sticky;inset-inline-start:0;z-index:6}
  .sheet-tbl td{padding:0;border-right:1px solid #f1f2f5;border-bottom:1px solid #f1f2f5;background:#fff;white-space:nowrap}
  .sheet-tbl td:first-child{position:sticky;inset-inline-start:0;background:#fff;font-weight:700;z-index:1;padding:6px 9px;border-right:2px solid var(--line)}
  .sheet-tbl tr:hover td{background:#fbfaff}
  .sheet-tbl tr:hover td:first-child{background:#f3effd}
  .cell-input{width:100%;border:none;padding:6px 9px;font-size:12px;background:transparent;outline:none;font-family:inherit}
  .cell-input:focus{background:#fef9c3;box-shadow:inset 0 0 0 2px var(--brand)}
  .cell-input.num{text-align:end;font-variant-numeric:tabular-nums}
  .cell-select{width:100%;border:none;padding:6px 9px;font-size:12px;background:transparent;outline:none}
  .cell-select:focus{background:#fef9c3}
  .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .filter-bar select,.filter-bar input{padding:5px 9px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none}
  .pill{background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;border:none;cursor:pointer}
  .pill.del{background:var(--bad-bg);color:var(--bad)}
  /* Stage flow */
  .flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:14px}
  .flow .step{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .flow .step.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .flow .step.done{background:var(--good-bg);color:var(--good);border-color:#bbf7d0}
  .flow .ar{color:#cbd5e1;font-size:12px}
  .niche-chip{display:inline-block;background:#eef2ff;color:#4f46e5;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-inline-end:3px}
  .lnk{color:var(--brand);text-decoration:none;font-size:11.5px}
  .lnk:hover{text-decoration:underline}
  @media(max-width:780px){.side{display:none}.side.mob{display:flex}.burger{display:block}.g3,.g2,.g4,.g6{grid-template-columns:1fr}.gsearch{width:120px}}
</style>
</head>

/* ===== Auth ===== */
async function loadProfile(){
 if(!app.session)return;
 var r=await SB.from('profiles').select('*').eq('id',app.session.user.id).maybeSingle();
 app.profile=r.data||null;
 if(!app.profile){await new Promise(function(res){setTimeout(res,800)});var r2=await SB.from('profiles').select('*').eq('id',app.session.user.id).maybeSingle();app.profile=r2.data||null}
}
async function loadSettings(){
 var r=await SB.from('settings').select('*');var s={};(r.data||[]).forEach(function(x){s[x.key]=x.value});app.cache.settings=s;
}
async function doAuth(){
 var email=val('f_email'),pass=val('f_pass'),name=val('f_name'),role=val('f_role')||'sourcing';
 app.err='';app.info='';app.busy=true;render();
 try{
  if(app.authMode==='in'){
   var r=await SB.auth.signInWithPassword({email:email,password:pass});
   if(r.error){app.err=r.error.message;app.busy=false;return render()}
  }else{
   if(!name||!email||!pass){app.err='Champs requis';app.busy=false;return render()}
   var s=await SB.auth.signUp({email:email,password:pass,options:{data:{full_name:name,role:role,lang:lang}}});
   if(s.error){app.err=s.error.message;app.busy=false;return render()}
   if(!s.data.session){var si=await SB.auth.signInWithPassword({email:email,password:pass});if(si.error){app.info='Compte cree. Connectez-vous.';app.authMode='in';app.busy=false;return render()}}
  }
  app.session=(await SB.auth.getSession()).data.session;
  await loadProfile();app.busy=false;app.view='pipeline';render();afterLogin();
 }catch(e){app.err=String(e&&e.message||e);app.busy=false;render()}
}
async function logout(){await SB.auth.signOut();app.session=null;app.profile=null;render()}

   var p=await SB.from('products').select('id,name,image_url,current_stage,price_final,cost_product_usd,ship_cost_usd').in('current_stage',['testing','validated']).order('updated_at',{ascending:false});

   app.cache.products=p.data||[];app.cache.tests=tt.data||[];app.cache.profiles=pr.data||[];
  } else if(v==='production'){
   var p=await SB.from('products').select('*').in('current_stage',['production','scaling','live']).order('updated_at',{ascending:false});
   app.cache.products=p.data||[];
  } else if(v==='video'){
   var p=await SB.from('products').select('id,name,image_url,current_stage').order('updated_at',{ascending:false});
   var pr=await SB.from('profiles').select('id,full_name,role');
   app.cache.products=p.data||[];app.cache.profiles=pr.data||[];
  } else if(v==='tasks'){
   var ta=await SB.from('tasks').select('*').order('created_at',{ascending:false});
   var pf=await SB.from('profiles').select('id,full_name,role');
   app.cache.tasks=ta.data||[];app.cache.profiles=pf.data||[];
  } else if(v==='team'){
   var pm=await SB.from('profiles').select('*').order('created_at',{ascending:true});
   app.cache.profiles=pm.data||[];
  } else if(v==='kpis'){
   var k=await SB.from('cod_kpis').select('*');
   var pk=await SB.from('products').select('id,name');
   app.cache.kpis=k.data||[];app.cache.products=pk.data||[];
  } else if(v==='settings'){
   await loadSettings();
  } else if(v==='product'){
   await loadProduct();await loadComments(app.productId);await loadAudit(app.productId);
  } else if(v==='orders'){
   await loadOrders();await loadBlacklist();

/* ===== Calculs ===== */
function totalCostDzd(p){var r=Number(p.usd_to_dzd||app.cache.settings.usd_to_dzd||260);return ((Number(p.cost_product_usd)||0)+(Number(p.ship_cost_usd)||0))*r}
function marginDzd(p){return (Number(p.price_final)||0)-totalCostDzd(p)}
function testCalcMargin(test,product){
 if(!product)return 0;
 var costDzd=totalCostDzd(product);
 var price=Number(product.price_final||0);
 var conf=Number(test.confirm_pct||0)/100;
 var deliv=Number(test.deliver_pct||0)/100;
 var rate=Number(product.usd_to_dzd||app.cache.settings.usd_to_dzd||260);
 var cpaDzd=Number(test.cpa_usd||0)*rate;
 if(conf<=0||deliv<=0)return -cpaDzd;
 var cpaPerDelivered=cpaDzd/(conf*deliv);
 return (price-costDzd-cpaPerDelivered);
}

}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[ _]/g,'').trim()}
var HMAP={produit:'product',product:'product',date:'day',jour:'day',day:'day',commandes:'orders',orders:'orders',confirmees:'confirmed',confirmed:'confirmed',livrees:'delivered',delivered:'delivered',retours:'returned',retour:'returned',returned:'returned',revenu:'revenue',revenue:'revenue',ca:'revenue',depensepub:'ad_spend',depense:'ad_spend',adspend:'ad_spend',pub:'ad_spend',spend:'ad_spend'};
async function importCsv(input){
 var f=input.files[0];if(!f)return;var text=await f.text();
 var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!==''});if(lines.length<2){alert('CSV vide');return}
 var d=lines[0].indexOf(';')>=0?';':',';
 var head=lines[0].split(d).map(function(h){return HMAP[norm(h)]||norm(h)});
 var pr=await SB.from('products').select('id,name');var byName={};(pr.data||[]).forEach(function(p){byName[p.name.toLowerCase().trim()]=p.id});
 var rows=[],skip=0;
 for(var i=1;i<lines.length;i++){var c=lines[i].split(d),o={};head.forEach(function(h,ix){o[h]=(c[ix]||'').trim()});if(!o.product)continue;var pid=byName[o.product.toLowerCase().trim()];if(!pid){skip++;continue}rows.push({product_id:pid,day:o.day||new Date().toISOString().slice(0,10),orders:num(o.orders),confirmed:num(o.confirmed),delivered:num(o.delivered),returned:num(o.returned),revenue:num(o.revenue),ad_spend:num(o.ad_spend),created_by:uid()})}
 if(rows.length){await SB.from('cod_kpis').insert(rows)}
 app.kpimsg=rows.length+' importes / '+skip+' ignores';refresh();
}

/* === KPI === */
function aggKpis(){var m={};(app.cache.kpis||[]).forEach(function(k){if(!k.product_id)return;var a=m[k.product_id]||(m[k.product_id]={product_id:k.product_id,orders:0,confirmed:0,delivered:0,returned:0,revenue:0,ad_spend:0});a.orders+=k.orders;a.confirmed+=k.confirmed;a.delivered+=k.delivered;a.returned+=k.returned;a.revenue+=Number(k.revenue);a.ad_spend+=Number(k.ad_spend)});return Object.keys(m).map(function(k){return m[k]})}
function signalOf(a){var dr=a.confirmed>0?a.delivered/a.confirmed:0;var net=a.revenue-a.ad_spend;var cr=a.orders>0?a.confirmed/a.orders:0;if(dr>=0.5&&net>0)return'scale';if(cr<0.4||net<=0)return'watch';return'test'}
function viewKpis(){
 var pname={};(app.cache.products||[]).forEach(function(p){pname[p.id]=p.name});var aggs=aggKpis();
 var head='<div class="pghead"><div><h1 class="pg">📈 '+t('kpis')+'</h1></div></div>';
 var imp='<div class="card" style="padding:14px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:3px">📑 '+t('importCsv')+'</div><div class="note">'+t('csvHint')+'</div><div class="row2"><label class="btn btn-p" style="cursor:pointer">'+t('selectCsv')+'<input type="file" accept=".csv" style="display:none" onchange="importCsv(this)"></label><button class="btn btn-g" onclick="downloadTemplate()">⬇ '+t('template')+'</button></div>'+(app.kpimsg?'<div style="margin-top:10px;background:var(--soft);color:var(--brand);border-radius:8px;padding:7px 10px;font-size:12.5px">'+esc(app.kpimsg)+'</div>':'')+'</div>';
 if(!aggs.length)return head+imp+'<div class="empty">'+t('empty')+'</div>';
 var maxNet=Math.max.apply(null,aggs.map(function(a){return Math.abs(a.revenue-a.ad_spend)}).concat([1]));
 var bars=aggs.slice().sort(function(x,y){return (y.revenue-y.ad_spend)-(x.revenue-x.ad_spend)}).map(function(a){var net=a.revenue-a.ad_spend;var col=net>0?'#16a34a':'#dc2626';return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span style="font-weight:600">'+esc(pname[a.product_id]||'-')+'</span><span style="font-weight:700;color:'+col+'">'+fmt(net)+' '+t('cur')+'</span></div><div class="bar"><div style="width:'+Math.round(Math.abs(net)/maxNet*100)+'%;background:'+col+'"></div></div></div>'}).join('');
 var rows=aggs.map(function(a){var cr=a.orders>0?Math.round(a.confirmed/a.orders*100):0;var dr=a.confirmed>0?Math.round(a.delivered/a.confirmed*100):0;var net=a.revenue-a.ad_spend;var s=signalOf(a);var sc=s==='scale'?'b-validated':s==='watch'?'b-killed':'b-research';return '<tr><td style="font-weight:700">'+esc(pname[a.product_id]||'-')+'</td><td style="text-align:end">'+fmt(a.orders)+'</td><td style="text-align:end">'+cr+'%</td><td style="text-align:end">'+dr+'%</td><td style="text-align:end">'+fmt(a.revenue)+'</td><td style="text-align:end;font-weight:700;color:'+(net>0?'var(--good)':'var(--bad)')+'">'+fmt(net)+'</td><td><span class="badge '+sc+'">'+t('sig_'+s)+'</span></td></tr>'}).join('');
 return head+imp+'<div class="card" style="padding:14px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:9px">'+t('netByP')+'</div>'+bars+'</div><div class="card scroll-x"><table><thead><tr><th>Produit</th><th style="text-align:end">'+t('orders')+'</th><th style="text-align:end">'+t('confRate')+'</th><th style="text-align:end">'+t('delivRate')+'</th><th style="text-align:end">'+t('revenue')+'</th><th style="text-align:end">'+t('net')+'</th><th>'+t('signal')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* === TEAM === */
function viewTeam(){
 var rows=(app.cache.profiles||[]).map(function(u){var opts=ROLES.map(function(r){return '<option value="'+r+'" '+(u.role===r?'selected':'')+'>'+t('r_'+r)+'</option>'}).join('');return '<tr><td><b>'+esc(u.full_name||'-')+'</b></td><td><select class="input sm" style="width:auto" onchange="setRole(\''+u.id+'\',this.value)">'+opts+'</select></td></tr>'}).join('');
 return '<div class="pghead"><div><h1 class="pg">👥 '+t('team')+'</h1></div></div><div class="card scroll-x"><table><thead><tr><th>'+t('member')+'</th><th>'+t('role')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* === SETTINGS === */
function viewSettings(){
 var s=app.cache.settings||{};
 var head='<div class="pghead"><div><h1 class="pg">⚙ '+t('settingsTitle')+'</h1></div></div>';
 var profile=app.profile;
 var profileCard='<div class="card" style="padding:16px;max-width:520px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:9px">'+t('profile')+'</div><div style="font-size:12px;color:var(--ink2)">'+t('fullName')+'</div><div style="font-weight:700;margin-bottom:6px">'+esc(profile.full_name||'')+'</div><div style="font-size:12px;color:var(--ink2)">'+t('role')+'</div>'+badge('b-testing',t('r_'+profile.role))+'</div>';
 var langCard='<div class="card" style="padding:16px;max-width:520px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:9px">'+t('language')+'</div><div class="row2"><button class="btn '+(lang==='fr'?'btn-p':'btn-g')+'" onclick="setLang(\'fr\')">Francais</button><button class="btn '+(lang==='ar'?'btn-p':'btn-g')+'" onclick="setLang(\'ar\')">العربية</button></div></div>';
 if(!isAdmin())return head+profileCard+langCard;
 var settingsCard='<div class="card" style="padding:16px;max-width:520px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:9px">💰 Variables financieres</div>'+
  '<div class="row2"><div><label class="lb">'+t('usdToDzd')+'</label><input id="s_usd_to_dzd" type="number" step="0.01" class="input" value="'+(s.usd_to_dzd||260)+'"></div><div><label class="lb">'+t('minMargin')+'</label><input id="s_min_margin_threshold" type="number" class="input" value="'+(s.min_margin_threshold||500)+'"></div></div>'+
  '<div class="row2" style="margin-top:10px"><div><label class="lb">'+t('defaultConfirm')+'</label><input id="s_default_confirm_rate" type="number" class="input" value="'+(s.default_confirm_rate||70)+'"></div><div><label class="lb">'+t('defaultDeliver')+'</label><input id="s_default_deliver_rate" type="number" class="input" value="'+(s.default_deliver_rate||60)+'"></div></div>'+
  '<button class="btn btn-p" style="margin-top:12px" onclick="saveSettings()" '+(app.busy?'disabled':'')+'>'+(app.busy?'<span class="spin"></span>':(app.saved?t('saved'):t('saveSettings')))+'</button>'+
 '</div>';
 var weightsCard='<div class="card" style="padding:16px;max-width:520px;margin-bottom:12px"><div style="font-weight:700;margin-bottom:9px">⚖️ '+t('weightsTitle')+'</div>'+
  '<div class="row2"><div><label class="lb">'+t('wow')+'</label><input id="s_weight_wow" type="number" step="0.1" min="0" class="input" value="'+(s.weight_wow||1)+'"></div><div><label class="lb">'+t('problem')+'</label><input id="s_weight_problem" type="number" step="0.1" min="0" class="input" value="'+(s.weight_problem||1)+'"></div></div>'+
  '<div class="row2" style="margin-top:9px"><div><label class="lb">'+t('beforeAfter')+'</label><input id="s_weight_before_after" type="number" step="0.1" min="0" class="input" value="'+(s.weight_before_after||1)+'"></div><div><label class="lb">'+t('innovation')+'</label><input id="s_weight_innovation" type="number" step="0.1" min="0" class="input" value="'+(s.weight_innovation||1)+'"></div></div>'+
  '<button class="btn btn-p" style="margin-top:11px" onclick="saveWeights()" '+(app.busy?'disabled':'')+'>'+t('save')+'</button>'+
 '</div>';
 return head+settingsCard+weightsCard+profileCard+langCard;
}
async function saveWeights(){
 app.busy=true;render();
 var keys=['weight_wow','weight_problem','weight_before_after','weight_innovation'];
 for(var i=0;i<keys.length;i++){var v=val('s_'+keys[i]);await SB.from('settings').upsert({key:keys[i],value:v,updated_at:new Date().toISOString(),updated_by:uid()})}
 await loadSettings();
 await SB.from('products').update({updated_at:new Date().toISOString()}).is('deleted_at',null);
 toast('⚖️ Poids sauves. Recalcul en cours...');app.busy=false;render();
}

/* === MODALS === */

   '<div class="row2" style="margin-top:9px"><div><label class="lb">'+t('budgetUsd')+'</label><input id="t_budget" type="number" step="0.01" class="input"></div><div><label class="lb">'+t('cpaUsd')+'</label><input id="t_cpa" type="number" step="0.01" class="input"></div></div>'+
   '<div class="row2" style="margin-top:9px"><div><label class="lb">'+t('confirmPct')+'</label><input id="t_conf" type="number" class="input" value="'+dc+'"></div><div><label class="lb">'+t('deliverPct')+'</label><input id="t_deliv" type="number" class="input" value="'+dd+'"></div></div>'+
   '<div style="margin-top:9px"><label class="lb">'+t('notes')+'</label><textarea id="t_notes" class="input" style="min-height:60px"></textarea></div>';
  return modalWrap(t('newTest'),b,'createTest()');
 }
 if(app.modal==='newOrder'){
  b='<div class="row2"><div><label class="lb">'+t('customer')+'</label><input id="o_name" class="input" autofocus></div><div><label class="lb">'+t('phone')+' *</label><input id="o_phone" class="input" placeholder="0555..."></div></div>'+
   '<div class="row2" style="margin-top:9px"><div><label class="lb">'+t('wilaya')+'</label><input id="o_wilaya" class="input" placeholder="Alger, Oran..."></div><div><label class="lb">'+t('product')+'</label><select id="o_product" class="input"><option value="">-</option>'+(app.cache.products||[]).map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></div></div>'+
   '<div class="row2" style="margin-top:9px"><div><label class="lb">'+t('quantity')+'</label><input id="o_qty" type="number" min="1" class="input" value="1"></div><div><label class="lb">'+t('unitPrice')+' ('+t('cur')+')</label><input id="o_unit_price" type="number" class="input"></div></div>'+
   '<div style="margin-top:9px"><label class="lb">'+t('address')+'</label><textarea id="o_address" class="input" style="min-height:50px"></textarea></div>'+
   '<div style="margin-top:9px"><label class="lb">'+t('notes')+'</label><textarea id="o_notes" class="input" style="min-height:50px"></textarea></div>';
  return modalWrap(t('newOrder'),b,'createOrder()');
 }
 if(app.modal==='newTask'){
  b='<div><label class="lb">'+t('title')+'</label><input id="nt_title" class="input" autofocus></div>'+
   '<div class="row2" style="margin-top:9px"><div><label class="lb">'+t('priority2')+'</label><select id="nt_prio" class="input">'+PRIOS.map(function(p){return '<option value="'+p+'"'+(p==='normal'?' selected':'')+'>'+t('pr_'+p)+'</option>'}).join('')+'</select></div><div><label class="lb">'+t('due')+'</label><input id="nt_due" type="date" class="input"></div></div>'+
   '<div style="margin-top:9px"><label class="lb">'+t('assignee')+'</label><select id="nt_assignee" class="input"><option value="">'+t('me')+'</option>'+(app.cache.profiles||[]).map(function(u){return '<option value="'+u.id+'">'+esc(u.full_name||u.id)+'</option>'}).join('')+'</select></div>';
  return modalWrap(t('newTask'),b,'createTask()');
 }
 return '';
}
function modalWrap(title,body,action){return '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="bx"><div class="mh"><b>'+title+'</b><button class="x" onclick="closeModal()">×</button></div><div class="mb">'+body+'</div><div class="mf"><button class="btn btn-g" onclick="closeModal()">'+t('cancel')+'</button><button class="btn btn-p" onclick="'+action+'" '+(app.busy?'disabled':'')+'>'+(app.busy?'<span class="spin"></span>':t('create'))+'</button></div></div></div>'}

/* === Init === */
async function init(){
 applyDir();applyDark();
 try{
  var s=await SB.auth.getSession();app.session=s.data.session;
  if(app.session){await loadProfile();await loadSettings();await loadNotifs()}
  render();
  if(app.session)afterLogin();
 }catch(e){console.error(e);render()}
 SB.auth.onAuthStateChange(async function(_e,sess){app.session=sess;if(sess){await loadProfile();await loadSettings();await loadNotifs();render();afterLogin()}else{app.profile=null;render()}});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(app.modal){closeModal()}else if(app.notifsOpen){app.notifsOpen=false;render()}}});
}
init();
</script>
