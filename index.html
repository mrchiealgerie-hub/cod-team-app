/* ===== Auth ===== */
async function loadProfile(){
  if(!app.session)return;
  var r=await SB.from('profiles').select('*').eq('id',app.session.user.id).maybeSingle();
  app.profile=r.data||null;
  // le trigger peut avoir un léger délai à la 1ère connexion
  if(!app.profile){await new Promise(function(res){setTimeout(res,800)});var r2=await SB.from('profiles').select('*').eq('id',app.session.user.id).maybeSingle();app.profile=r2.data||null;}
}
async function doAuth(){
  app.err='';app.info='';app.busy=true;render();
  var email=val('f_email'),pass=val('f_pass');
  try{
    if(app.authMode==='in'){
      var r=await SB.auth.signInWithPassword({email:email,password:pass});
      if(r.error){app.err=r.error.message;app.busy=false;return render();}
    }else{
      var name=val('f_name'),role=val('f_role')||'sourcing';
      if(!name||!email||!pass){app.err=t('fill')||'Champs requis';app.busy=false;return render();}
      var s=await SB.auth.signUp({email:email,password:pass,options:{data:{full_name:name,role:role,lang:lang}}});
      if(s.error){app.err=s.error.message;app.busy=false;return render();}
      if(!s.data.session){ // confirmation e-mail probablement activée
        var si=await SB.auth.signInWithPassword({email:email,password:pass});
        if(si.error){app.info=t('confirmMsg');app.authMode='in';app.busy=false;return render();}
      }
    }
    app.session=(await SB.auth.getSession()).data.session;
    await loadProfile();app.busy=false;app.view='dashboard';render();afterLogin();
  }catch(e){app.err=String(e&&e.message||e);app.busy=false;render();}
}
async function logout(){await SB.auth.signOut();app.session=null;app.profile=null;render();}

/* CSV */
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ _]/g,'').trim()}
var HMAP={produit:'product',product:'product',date:'day',jour:'day',day:'day',commandes:'orders',orders:'orders',confirmees:'confirmed',confirmed:'confirmed',livrees:'delivered',delivered:'delivered',retours:'returned',retour:'returned',returned:'returned',revenu:'revenue',revenue:'revenue',ca:'revenue',depensepub:'ad_spend',depense:'ad_spend',adspend:'ad_spend',pub:'ad_spend',spend:'ad_spend'};
function nbr(v){var x=parseFloat(String(v==null?'':v).replace(',','.').replace(/[^\d.-]/g,''));return isNaN(x)?0:x}
async function importCsv(input){
  var f=input.files[0];if(!f)return;var text=await f.text();
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!==''});if(lines.length<2){alert('CSV vide');return}
  var d=lines[0].indexOf(';')>=0?';':',';
  var head=lines[0].split(d).map(function(h){return HMAP[norm(h)]||norm(h)});
  var pr=await SB.from('products').select('id,name');var byName={};(pr.data||[]).forEach(function(p){byName[p.name.toLowerCase().trim()]=p.id});
  var rows=[],skip=0;
  for(var i=1;i<lines.length;i++){var c=lines[i].split(d),o={};head.forEach(function(h,ix){o[h]=(c[ix]||'').trim()});if(!o.product)continue;var pid=byName[o.product.toLowerCase().trim()];if(!pid){skip++;continue}rows.push({product_id:pid,day:o.day||new Date().toISOString().slice(0,10),orders:nbr(o.orders),confirmed:nbr(o.confirmed),delivered:nbr(o.delivered),returned:nbr(o.returned),revenue:nbr(o.revenue),ad_spend:nbr(o.ad_spend),created_by:uid()});}
  if(rows.length){await SB.from('cod_kpis').insert(rows);}
  app.kpimsg=rows.length+' '+t('imported')+' · '+skip+' '+t('skipped');refresh();
}

  if(!aggs.length)return head+imp+'<div class="empty">'+t('emptyKpi')+'</div>';
  var maxNet=Math.max.apply(null,aggs.map(function(a){return Math.abs(a.revenue-a.ad_spend)}).concat([1]));
  var bars=aggs.slice().sort(function(x,y){return (y.revenue-y.ad_spend)-(x.revenue-x.ad_spend)}).map(function(a){var net=a.revenue-a.ad_spend;var col=net>0?'#16a34a':'#dc2626';return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">'+esc(pname[a.product_id]||'—')+'</span><span style="font-weight:700;color:'+col+'">'+fmt(net)+' '+t('cur')+'</span></div><div class="bar"><div style="width:'+Math.round(Math.abs(net)/maxNet*100)+'%;background:'+col+'"></div></div></div>'}).join('');
  var rows=aggs.map(function(a){var cr=a.orders>0?Math.round(a.confirmed/a.orders*100):0;var dr=a.confirmed>0?Math.round(a.delivered/a.confirmed*100):0;var net=a.revenue-a.ad_spend;var s=signalOf(a);var sc=s==='scale'?'b-val':(s==='watch'?'b-kill':'b-ready');return '<tr><td style="font-weight:700">'+esc(pname[a.product_id]||'—')+'</td><td style="text-align:end">'+fmt(a.orders)+'</td><td style="text-align:end">'+cr+'%</td><td style="text-align:end">'+dr+'%</td><td style="text-align:end">'+fmt(a.revenue)+' '+t('cur')+'</td><td style="text-align:end;font-weight:700;color:'+(net>0?'#16a34a':'#dc2626')+'">'+fmt(net)+'</td><td>'+badge(sc,t('sig_'+s))+'</td></tr>'}).join('');
  return head+imp+'<div class="card" style="padding:18px;margin-bottom:18px"><div style="font-weight:700;margin-bottom:12px">'+t('netByP')+'</div>'+bars+'</div><div class="card" style="overflow:auto"><table><thead><tr><th>'+t('products')+'</th><th style="text-align:end">'+t('orders')+'</th><th style="text-align:end">'+t('confRate')+'</th><th style="text-align:end">'+t('delivRate')+'</th><th style="text-align:end">'+t('revenue')+'</th><th style="text-align:end">'+t('net')+'</th><th>'+t('signal')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function viewTeam(){
  var rows=(app.cache.profiles||[]).map(function(u){var opts=ROLES.map(function(r){return '<option value="'+r+'" '+(u.role===r?'selected':'')+'>'+t('r_'+r)+'</option>'}).join('');return '<tr><td><b>'+esc(u.full_name||'—')+'</b></td><td><select class="input" style="padding:6px 8px;width:auto" onchange="setRole(\''+u.id+'\',this.value)">'+opts+'</select></td></tr>'}).join('');
  return '<div class="pghead"><div><h1 class="pg">'+t('team')+'</h1><div class="sub">'+t('teamSub')+'</div></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>'+t('member')+'</th><th>'+t('role')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function viewSettings(){
  var u=app.profile;
  return '<div class="pghead"><div><h1 class="pg">'+t('settings')+'</h1></div></div><div class="card" style="padding:18px;max-width:520px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:10px">'+t('profile')+'</div><div style="font-size:13px;color:var(--ink2)">'+t('fullName')+'</div><div style="font-weight:700">'+esc(u.full_name||'')+'</div><div style="font-size:13px;color:var(--ink2);margin-top:8px">'+t('role')+'</div>'+badge('b-test',t('r_'+u.role))+'</div><div class="card" style="padding:18px;max-width:520px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:10px">'+t('language')+'</div><div class="row2" style="gap:8px"><button class="btn '+(lang==='fr'?'btn-p':'btn-g')+'" onclick="setLang(\'fr\')">Français</button><button class="btn '+(lang==='ar'?'btn-p':'btn-g')+'" onclick="setLang(\'ar\')">العربية</button></div></div><div class="card" style="padding:18px;max-width:520px"><div style="font-weight:700;margin-bottom:10px">'+t('account')+'</div><div style="font-size:13px;color:var(--ink2);margin-bottom:12px">'+esc(app.session.user.email||'')+'</div><button class="btn btn-g" onclick="logout()">⎋ '+t('logout')+'</button></div>';
}
function renderModal(){
  var b='';
  if(app.modal==='product'){
    b='<div><label class="lb">'+t('name')+'</label><input id="np_name" class="input"></div>'+
    '<div class="row2" style="margin-top:10px"><div><label class="lb">'+t('supplier')+'</label><input id="np_supplier" class="input"></div><div><label class="lb">'+t('status')+'</label><select id="np_status" class="input">'+PST.map(function(s){return '<option value="'+s+'">'+t('s_'+s)+'</option>'}).join('')+'</select></div></div>'+
    '<div class="row2" style="margin-top:10px"><div><label class="lb">'+t('costBuy')+'</label><input id="np_cost" class="input" type="number"></div><div><label class="lb">'+t('priceSell')+'</label><input id="np_price" class="input" type="number"></div></div>'+
    '<div class="row2" style="margin-top:10px"><div><label class="lb">'+t('shipping')+'</label><input id="np_ship" class="input" type="number"></div><div><label class="lb">'+t('capacity')+'</label><input id="np_cap" class="input" type="number"></div></div>'+
    '<div class="row2" style="margin-top:10px"><div><label class="lb">'+t('productLink')+'</label><input id="np_link" class="input" placeholder="https://"></div><div><label class="lb">'+t('imageUrl')+'</label><input id="np_image" class="input" placeholder="https://"></div></div>'+
    '<div style="margin-top:10px"><label class="lb">'+t('notes')+'</label><textarea id="np_notes" class="input"></textarea></div>';
    return modalWrap(t('newProduct'),b,'createProduct()');
  }
  if(app.modal==='task'){
    b='<div><label class="lb">'+t('title')+'</label><input id="nt_title" class="input"></div>'+
    '<div class="row2" style="margin-top:10px"><div><label class="lb">'+t('priority')+'</label><select id="nt_prio" class="input">'+PRIOS.map(function(p){return '<option value="'+p+'">'+t('pr_'+p)+'</option>'}).join('')+'</select></div><div><label class="lb">'+t('due')+'</label><input id="nt_due" class="input" type="date"></div></div>'+
    '<div style="margin-top:10px"><label class="lb">'+t('assignee')+'</label><select id="nt_assignee" class="input"><option value="">'+t('me')+'</option>'+(app.cache.profiles||[]).map(function(u){return '<option value="'+u.id+'">'+esc(u.full_name||u.id)+'</option>'}).join('')+'</select></div>';
    return modalWrap(t('newTask'),b,'createTask()');
  }
  return '';
}
function modalWrap(title,body,action){return '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="bx"><div class="mh"><b>'+title+'</b><button class="x" onclick="closeModal()">×</button></div><div class="mb">'+body+'</div><div class="mf"><button class="btn btn-g" onclick="closeModal()">'+t('cancel')+'</button><button class="btn btn-p" onclick="'+action+'" '+(app.busy?'disabled':'')+'>'+(app.busy?'<span class="spin"></span>':t('create'))+'</button></div></div></div>';}

/* ===== Init ===== */
async function init(){
  applyDir();
  try{
    var s=await SB.auth.getSession();app.session=s.data.session;
    if(app.session){await loadProfile();}
    render();
    if(app.session)afterLogin();
  }catch(e){console.error(e);render();}
  SB.auth.onAuthStateChange(async function(_e,sess){app.session=sess;if(sess){await loadProfile();render();afterLogin();}else{app.profile=null;render();}});
}
init();
</script>
</body>
</html>
