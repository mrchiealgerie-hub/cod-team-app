  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

  button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 13px;font-size:13.5px;font-weight:700;border:none;white-space:nowrap}
  .btn-p{background:var(--brand);color:#fff}.btn-p:hover{background:#5b21b6}.btn-p:disabled{opacity:.6}
  .btn-g{background:#fff;color:#3a3f4b;border:1px solid var(--line)}.btn-g:hover{background:#f3f4f7}

  .btn-s{font-size:11px;padding:4px 8px;border-radius:6px}
  .input{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:8px 10px;font-size:13.5px;outline:none;background:#fff}
  .input:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--soft)}
  .input.sm{padding:4px 7px;font-size:12.5px;border-radius:6px}
  label.lb{display:block;font-size:12.5px;font-weight:600;color:#3a3f4b;margin:0 0 4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px}
  .badge{display:inline-flex;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;line-height:1.6}
  .b-idea{background:#f1f2f5;color:#555}.b-research{background:#fef3c7;color:#92660b}.b-tovalidate{background:#fde68a;color:#854d0e}.b-sourcing{background:#dbeafe;color:#1d4ed8}.b-workshop{background:#cffafe;color:#155e75}.b-testing{background:#ede9fe;color:#6d28d9}.b-validated{background:#dcfce7;color:#15803d}.b-production{background:#bbf7d0;color:#166534}.b-scaling{background:#86efac;color:#14532d}.b-video{background:#fce7f3;color:#9d174d}.b-live{background:#a7f3d0;color:#064e3b}.b-killed{background:#fee2e2;color:#b91c1c}
  .b-todo{background:#f1f2f5;color:#555}.b-doing{background:#dbeafe;color:#1d4ed8}.b-done{background:#dcfce7;color:#15803d}
  .pri-low{background:#f1f2f5;color:#666}.pri-normal{background:#dbeafe;color:#1d4ed8}.pri-high{background:#fef3c7;color:#92660b}.pri-urgent{background:#fee2e2;color:#b91c1c}
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(140deg,#5b21b6,#7c3aed,#10142a)}
  .login .box{width:100%;max-width:400px}
  .login .head{text-align:center;color:#fff;margin-bottom:18px}
  .login .logo{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
  .login h1{font-size:24px}.login .sub{color:rgba(255,255,255,.8);font-size:14px;margin-top:3px}
  .login .form{background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .login h2{font-size:18px;margin-bottom:16px}.login .row{margin-bottom:13px}
  .link{background:none;border:none;color:var(--brand);font-weight:700;font-size:14px;width:100%;margin-top:14px}
  .err{background:#fee2e2;color:#b91c1c;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px}
  .info{background:#e0f2fe;color:#075985;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px}
  .ok{background:var(--good-bg);color:var(--good);border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px}
  .langtop{position:fixed;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:9px;padding:7px 12px;font-weight:800;font-size:13px}
  .shell{display:flex;min-height:100vh}
  .side{width:230px;flex:none;background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
  .side.mob{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 9px 14px}
  .brand .lg{width:32px;height:32px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .brand b{font-size:16px;font-weight:800}
  .nav{display:flex;flex-direction:column;gap:1px;flex:1}
  .nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:#3a3f4b;text-decoration:none;cursor:pointer}
  .nav a:hover{background:#f3f4f7}.nav a.on{background:var(--soft);color:var(--brand)}.nav a .ic{width:16px;text-align:center;font-size:14px}
  .nav .sep{font-size:10px;text-transform:uppercase;color:#9ca3af;font-weight:800;letter-spacing:.06em;padding:10px 11px 4px;letter-spacing:.05em}
  .nav a .cnt{margin-inline-start:auto;background:#f1f2f5;color:#555;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700;min-width:18px;text-align:center}
  .nav a.on .cnt{background:#e9e0fb;color:var(--brand)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:9px 16px}
  .top .sp{flex:1}.burger{display:none;background:none;border:none;font-size:22px;color:#3a3f4b}
  .who{display:flex;align-items:center;gap:8px}
  .who .nm{font-size:12.5px;font-weight:700;line-height:1.2;text-align:end}.who .rl{font-size:10.5px;color:var(--ink2)}
  .who .av{width:32px;height:32px;border-radius:50%;background:#e9e0fb;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
  .gsearch{background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;outline:none;width:220px}
  .gsearch:focus{border-color:var(--brand2);box-shadow:0 0 0 3px var(--soft);background:#fff}
  .content{padding:18px 16px;overflow:auto;flex:1}.inner{max-width:1280px;margin:0 auto}
  h1.pg{font-size:22px;font-weight:800;letter-spacing:-.01em}.sub{color:var(--ink2);font-size:13.5px;margin-top:2px}
  .pghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
  .pghead .acts{display:flex;gap:6px;flex-wrap:wrap}
  .grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
  .stat{padding:15px}.stat .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:9px;font-size:17px}
  .stat .v{font-size:26px;font-weight:800;line-height:1.1}.stat .l{font-size:12.5px;color:var(--ink2);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8f9fb;text-align:start;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #f1f2f5;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr.row-hover:hover td{background:#fbfaff}
  .scroll-x{overflow-x:auto;max-width:100%}
  .kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
  .col{width:230px;flex:none;border-radius:11px;padding:5px;transition:.15s;background:transparent}
  .col.over{background:var(--soft);box-shadow:inset 0 0 0 2px #d4c4f7}
  .col .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding:0 4px}
  .kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px;cursor:grab;transition:.1s}
  .kc:hover{border-color:#d4c4f7;box-shadow:0 1px 3px rgba(0,0,0,.05)}

  .kc .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:80}
  .modal .bx{background:#fff;border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow:auto}

  .demo{background:var(--navy);color:#9ff0c4;font-size:11.5px;text-align:center;padding:5px}

  .note{font-size:11.5px;color:var(--ink2);margin-bottom:8px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center{display:flex;align-items:center;justify-content:center;min-height:60vh}
  /* Star rating */
  .stars{display:inline-flex;gap:2px}
  .stars button{background:none;border:none;font-size:18px;line-height:1;color:#d1d5db;padding:0;cursor:pointer;transition:.1s}

  .score-chip.lo{background:var(--bad-bg);color:var(--bad)}

  .sheet-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 220px)}

  .sheet-tbl td{padding:0;border-right:1px solid #f1f2f5;border-bottom:1px solid #f1f2f5;background:#fff;white-space:nowrap}
  .sheet-tbl td:first-child{position:sticky;inset-inline-start:0;background:#fff;font-weight:700;z-index:1;padding:6px 9px;border-right:2px solid var(--line)}
  .sheet-tbl tr:hover td{background:#fbfaff}
  .sheet-tbl tr:hover td:first-child{background:#f3effd}
  .cell-input{width:100%;border:none;padding:6px 9px;font-size:12px;background:transparent;outline:none;font-family:inherit}
  .cell-input:focus{background:#fef9c3;box-shadow:inset 0 0 0 2px var(--brand)}
  .cell-input.num{text-align:end;font-variant-numeric:tabular-nums}
  .cell-select{width:100%;border:none;padding:6px 9px;font-size:12px;background:transparent;outline:none}
  .cell-select:focus{background:#fef9c3}
  .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .filter-bar select,.filter-bar input{padding:5px 9px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none}
  .pill{background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;border:none;cursor:pointer}
  .pill.del{background:var(--bad-bg);color:var(--bad)}
  /* Stage flow */
  .flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:14px}
  .flow .step{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap}
  .flow .step.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .flow .step.done{background:var(--good-bg);color:var(--good);border-color:#bbf7d0}
  .flow .ar{color:#cbd5e1;font-size:12px}
  .niche-chip{display:inline-block;background:#eef2ff;color:#4f46e5;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-inline-end:3px}
  .lnk{color:var(--brand);text-decoration:none;font-size:11.5px}
  .lnk:hover{text-decoration:underline}
  @media(max-width:780px){.side{display:none}.side.mob{display:flex}.burger{display:block}.g3,.g2,.g4,.g6{grid-template-columns:1fr}.gsearch{width:120px}}
</style>
</head>

function aiBuildScript(name,price,niche,usp,benefits,audience){
 var tpl=NICHE_TEMPLATES[niche]||{};
 var base=tpl.call_script||'Bonjour, c\'est [Marque] pour confirmer votre commande [produit] au prix de [prix] DA, paiement a la livraison.';
 var greeting='Bonjour'+(audience&&/femme|dame|madame/i.test(audience)?' madame':audience&&/homme|monsieur/i.test(audience)?' monsieur':'')+', c\'est [Marque].';
 var pitch=usp?' Je vous appelle pour confirmer votre commande de '+name+', '+usp+'.':' Je vous appelle pour confirmer votre commande de '+name+'.';
 var price_line=' Le prix est de '+(price||tpl.price_final||0)+' DA, paiement a la livraison.';
 var benefits_line=benefits?' Pour rappel : '+benefits.split('\n').filter(Boolean).slice(0,3).join(' / ')+'.':'';
 var close=' Pouvez-vous confirmer votre adresse et votre numero ?';
 return greeting+pitch+price_line+benefits_line+close;
}
function aiBuildObjections(niche,usp,benefits){
 var tpl=NICHE_TEMPLATES[niche]||{};var base=tpl.objections||'';
 var lines=[];
 lines.push('"C\'est cher" -> Rappeler la qualite et '+(usp||'l\'avantage unique')+'. Mentionner la livraison gratuite et le paiement a la livraison (zero risque).');
 lines.push('"Je vais reflechir" -> "Je comprends. Le stock est limite, je peux vous reserver une unite aujourd\'hui ?"');
 lines.push('"Ca marche vraiment ?" -> Rassurer avec garantie + retours possibles si non satisfait.');
 if(benefits)lines.push('"Pourquoi votre produit ?" -> '+benefits.split('\n').filter(Boolean).slice(0,2).join(' / '));
 if(base)lines.push(base);
 return lines.join('\n');
}
function aiBuildUpsells(niche,price){
 var tpl=NICHE_TEMPLATES[niche]||{};var base=tpl.upsells||'';
 var p=price||tpl.price_final||0;var p2=Math.round(p*1.7);var p3=Math.round(p*2.4);
 var lines=[];
 lines.push('Pack 2 unites a '+p2+' DA (au lieu de '+(p*2)+' DA) -> economisez '+(p*2-p2)+' DA.');
 lines.push('Pack 3 unites + cadeau a '+p3+' DA (au lieu de '+(p*3)+' DA) -> '+(p*3-p3)+' DA d\'economie.');
 if(base)lines.push(base);
 return lines.join('\n');
}
function aiBuildFaq(niche,name){
 var tpl=NICHE_TEMPLATES[niche]||{};var base=tpl.faq||'';
 var lines=[];
 lines.push('Q: Livraison combien de temps ?\nR: 48 a 72h, partout en Algerie (Yalidine/ZRexpress).');
 lines.push('Q: Comment je paie ?\nR: A la livraison (cash), pas d\'avance.');
 lines.push('Q: Si je ne suis pas satisfait ?\nR: Vous pouvez refuser le colis a la livraison.');
 lines.push('Q: Le produit '+name+' est-il garanti ?\nR: Oui, garantie 30 jours sur defaut de fabrication.');
 if(base)lines.push(base);
 return lines.join('\n');
}
function aiGenerateBrief(){
 var p=(app.cache.products||[]).find(function(x){return x.id===app.productId});if(!p)return;
 var usp=val('ai_usp')||'';var benefits=val('ai_benefits')||'';var audience=val('ai_audience')||'';
 var niche=p.niche||'';var name=p.name||'produit';var price=p.price_final||0;

 setIfPresent('sh_faq',aiBuildFaq(niche,name));
 closeModal();toast('🤖 '+t('aiNote'));
}

/* === Auto-translation (Google Translate free endpoint) === */
async function translateText(text,target){
 if(!text||!text.trim())return '';
 try{
  var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+encodeURIComponent(target)+'&dt=t&q='+encodeURIComponent(text);
  var r=await fetch(url);if(!r.ok)throw new Error('http '+r.status);
  var data=await r.json();
  if(!data||!data[0])return '';
  return data[0].map(function(seg){return seg[0]||''}).join('');
 }catch(e){console.error('translate',e);return ''}
}
async function translateField(srcId,target){
 var src=document.getElementById(srcId);if(!src)return;
 var orig=src.value||'';if(!orig.trim()){toast('Champ vide','warn');return}
 var btnId='tr_btn_'+srcId+'_'+target;var btn=document.getElementById(btnId);if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>'}
 var out=await translateText(orig,target);
 if(btn){btn.disabled=false;btn.textContent=t('translated')}
 if(!out){toast('Echec de la traduction','err');return}
 src.value=out;toast('✓ '+t('translated')+' ('+target.toUpperCase()+')');
}
async function translateAllFields(target){
 var ids=['sh_script','sh_obj','sh_up','sh_faq'];
 toast(t('translating')+' ('+target.toUpperCase()+')...');
 for(var i=0;i<ids.length;i++){
  var el=document.getElementById(ids[i]);if(!el||!el.value.trim())continue;
  var out=await translateText(el.value,target);if(out)el.value=out;
 }
 toast('✓ '+t('translated')+' ('+target.toUpperCase()+')');
}

/* Shipping & marge avec wilaya */
function wilayaShipping(code){var w=(app.cache.wilayas||[]).find(function(x){return x.code===code});return w?Number(w.yalidine_rate||0):0}
function avgShippingForProduct(){if(!app.cache.wilayas||!app.cache.wilayas.length)return 600;var s=0,n=0;app.cache.wilayas.forEach(function(w){s+=Number(w.yalidine_rate||0);n++});return n?Math.round(s/n):600}
function realMargin(p){var rate=Number(p.usd_to_dzd||app.cache.settings.usd_to_dzd||260);var ship=avgShippingForProduct();var cost=((Number(p.cost_product_usd)||0)+(Number(p.ship_cost_usd)||0))*rate+ship;return (Number(p.price_final)||0)-cost}

/* Auto-suggestions scaling/kill */
function buildSuggestions(){
 var suggestions=[];var minMargin=Number(app.cache.settings.min_margin_threshold||500);
 (app.cache.products||[]).filter(function(p){return ['testing','validated','scaling','live'].indexOf(p.current_stage)>=0}).forEach(function(p){
  var m=realMargin(p);
  var pTests=(app.cache.tests||[]).filter(function(tx){return tx.product_id===p.id});
  var pKpis=(app.cache.kpis||[]).filter(function(k){return k.product_id===p.id});
  var net=0,cr=0,dr=0,orders=0;
  pKpis.forEach(function(k){net+=Number(k.revenue||0)-Number(k.ad_spend||0);orders+=k.orders||0;cr+=k.confirmed||0;dr+=k.delivered||0});
  var crPct=orders>0?cr/orders:0;var drPct=cr>0?dr/cr:0;
  if(p.current_stage==='testing'&&net>0&&drPct>=0.5&&m>minMargin){suggestions.push({type:'scale',product:p,reason:'Net +'+fmt(net)+' DA, livraison '+Math.round(drPct*100)+'%, marge '+fmt(m)+' DA'})}
  else if(p.current_stage==='testing'&&(net<-minMargin||crPct<0.3)){suggestions.push({type:'watch',product:p,reason:'Net '+fmt(net)+' DA, confirmation '+Math.round(crPct*100)+'%'})}
  else if(p.current_stage==='scaling'&&net<0){suggestions.push({type:'watch',product:p,reason:'Scaling en perte: '+fmt(net)+' DA'})}
 });
 return suggestions.slice(0,10);
}

/* ===== Calculs ===== */
function totalCostDzd(p){var r=Number(p.usd_to_dzd||app.cache.settings.usd_to_dzd||260);return ((Number(p.cost_product_usd)||0)+(Number(p.ship_cost_usd)||0))*r}
function marginDzd(p){return (Number(p.price_final)||0)-totalCostDzd(p)}
function testCalcMargin(test,product){
 if(!product)return 0;
 var costDzd=totalCostDzd(product);
 var price=Number(product.price_final||0);
 var conf=Number(test.confirm_pct||0)/100;
 var deliv=Number(test.deliver_pct||0)/100;
 var rate=Number(product.usd_to_dzd||app.cache.settings.usd_to_dzd||260);
 var cpaDzd=Number(test.cpa_usd||0)*rate;
 if(conf<=0||deliv<=0)return -cpaDzd;
 var cpaPerDelivered=cpaDzd/(conf*deliv);
 return (price-costDzd-cpaPerDelivered);
}

 for(var i=d-1;i>=0;i--){var day=new Date(today.getTime()-i*86400000);var dayStr=day.toISOString().slice(0,10);

function buildCohorts(orders){
 var byPhone={};orders.forEach(function(o){if(!o.customer_phone)return;var p=o.customer_phone;if(!byPhone[p])byPhone[p]=[];byPhone[p].push(o)});
 var cohorts={};
 Object.keys(byPhone).forEach(function(phone){
  var arr=byPhone[phone].slice().sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at)});
  var first=arr[0];if(!first||!first.created_at)return;
  var fm=first.created_at.slice(0,7);
  if(!cohorts[fm])cohorts[fm]={month:fm,customers:0,m0:0,m1:0,m2:0,m3:0};
  cohorts[fm].customers++;cohorts[fm].m0++;
  var firstD=new Date(first.created_at);
  for(var i=1;i<arr.length;i++){
   var dt=new Date(arr[i].created_at);
   var monthsDiff=(dt.getFullYear()-firstD.getFullYear())*12+(dt.getMonth()-firstD.getMonth());
   if(monthsDiff===1)cohorts[fm].m1++;
   else if(monthsDiff===2)cohorts[fm].m2++;
   else if(monthsDiff===3)cohorts[fm].m3++;
  }
 });
 return Object.values(cohorts).sort(function(a,b){return b.month.localeCompare(a.month)}).slice(0,6);
}

/* === Client 360 helpers === */
var DELIVERED_STATUSES={delivered:1};
var POSITIVE_STATUSES={delivered:1,confirmed:1};
var DAY_MS=86400000;
function daysSince(dt){if(!dt)return 99999;return Math.floor((Date.now()-new Date(dt).getTime())/DAY_MS)}
function daysSinceLabel(d){if(d<=0)return t('today');return t('daysAgo').replace('##',d)}
function segmentOf(stat,isBlacklisted){
 if(isBlacklisted)return 'blacklist';
 var n=stat.count,ltv=stat.ltv,last=stat.daysSinceLast;
 if(n>=5&&ltv>=30000&&last<90)return 'vip';
 if(n>=2&&last<90)return 'recurrent';
 if(n>=2&&last>=180)return 'lost';
 if(n>=2&&last>=60)return 'atrisk';
 if(n===1&&last<30)return 'new';
 if(n===1)return 'oneshot';
 return 'recurrent';
}
var SEG_COLOR={vip:'b-live',recurrent:'b-validated',new:'b-research',atrisk:'b-tovalidate',lost:'b-arch',oneshot:'b-todo',blacklist:'b-killed'};
var SEG_ORDER=['vip','recurrent','new','atrisk','lost','oneshot','blacklist'];
function clientScore(stat){
 var pCount=Math.min(stat.count*8,40);
 var pLtv=Math.min(Math.floor(stat.ltv/2000),30);
 var pRec=Math.max(0,30-Math.floor(stat.daysSinceLast/3));
 return Math.max(0,Math.min(100,pCount+pLtv+pRec));
}
function buildClients(orders,blacklist){
 var blMap={};(blacklist||[]).forEach(function(b){blMap[b.phone]=b.reason||''});
 var byPhone={};
 (orders||[]).forEach(function(o){if(!o.customer_phone)return;
  var p=o.customer_phone;
  if(!byPhone[p])byPhone[p]={phone:p,name:o.customer_name||'',wilaya:o.customer_wilaya||'',orders:[],ltv:0,delivered:0,count:0,first:null,last:null};
  var c=byPhone[p];c.orders.push(o);c.count++;
  if(o.customer_name&&!c.name)c.name=o.customer_name;
  if(o.customer_wilaya&&!c.wilaya)c.wilaya=o.customer_wilaya;
  if(DELIVERED_STATUSES[o.status]){c.ltv+=Number(o.total_price||0);c.delivered++}
  var d=o.created_at;if(d){if(!c.first||d<c.first)c.first=d;if(!c.last||d>c.last)c.last=d}
 });
 return Object.values(byPhone).map(function(c){
  c.daysSinceLast=daysSince(c.last);c.daysSinceFirst=daysSince(c.first);
  c.aov=c.delivered?Math.round(c.ltv/c.delivered):0;
  c.deliveryRate=c.count?Math.round(c.delivered*100/c.count):0;
  c.isBlacklist=!!blMap[c.phone];c.blacklistReason=blMap[c.phone]||'';
  c.segment=segmentOf(c,c.isBlacklist);
  c.score=clientScore(c);
  return c;
 }).sort(function(a,b){return b.score-a.score});
}

function creativeMetrics(c){
 var imp=Number(c.impressions||0),clk=Number(c.clicks||0),sp=Number(c.spend_usd||0),conv=Number(c.conversions||0),rev=Number(c.revenue_dzd||0);
 var usd=Number((app.cache.settings&&app.cache.settings.usd_to_dzd)||250);
 var ctr=imp>0?(clk/imp)*100:0;
 var cpm=imp>0?(sp/imp)*1000:0;
 var cpa=conv>0?(sp/conv):0;
 var spDzd=sp*usd;
 var roas=spDzd>0?(rev/spDzd):0;
 var net=rev-spDzd;
 return {ctr:ctr,cpm:cpm,cpa:cpa,roas:roas,net:net,spDzd:spDzd};
}
function creativeVerdict(c,peers){
 if(['winner','loser','paused','retest'].indexOf(c.status)>=0)return {auto:c.status,reason:''};
 var m=creativeMetrics(c);var imp=Number(c.impressions||0),conv=Number(c.conversions||0);
 if(imp<100&&conv<3)return {auto:'running',reason:'Donnees insuffisantes (< 100 impressions)'};
 if(imp>=1000&&m.ctr<0.5)return {auto:'loser',reason:'CTR < 0.5% avec '+imp+' impressions'};
 var bestPeer=null;peers.forEach(function(p){if(p.id===c.id)return;var pm=creativeMetrics(p);if(p.impressions>=100&&(!bestPeer||pm.roas>creativeMetrics(bestPeer).roas))bestPeer=p});
 if(bestPeer){var bm=creativeMetrics(bestPeer);
  if(m.roas>=1.5*bm.roas&&m.roas>1&&imp>=100)return {auto:'winner',reason:'ROAS '+m.roas.toFixed(2)+'x vs '+bm.roas.toFixed(2)+'x du concurrent'};
  if(bm.roas>=1.5*m.roas&&bm.roas>1&&imp>=100)return {auto:'loser',reason:'Battu par '+esc(bestPeer.creative_name)+' (ROAS '+bm.roas.toFixed(2)+'x vs '+m.roas.toFixed(2)+'x)'};
 }
 if(m.roas>=2&&imp>=200)return {auto:'winner',reason:'ROAS '+m.roas.toFixed(2)+'x (excellent)'};
 if(m.roas<0.7&&imp>=500)return {auto:'loser',reason:'ROAS '+m.roas.toFixed(2)+'x (deficitaire)'};
 return {auto:'running',reason:'Continuer le test'};
}

/* === Cashflow Forecast 30 days === */
function buildCashflowForecast(orders,kpis,products,settings,scenario){
 scenario=scenario||'expected';
 var usd=Number(settings.usd_to_dzd||260);
 var confR=Number(settings.default_confirm_rate||70)/100;
 var delivR=Number(settings.default_deliver_rate||60)/100;
 if(scenario==='conservative'){confR*=0.85;delivR*=0.85}
 else if(scenario==='optimistic'){confR=Math.min(0.98,confR*1.1);delivR=Math.min(0.98,delivR*1.1)}
 var prodMap={};(products||[]).forEach(function(p){prodMap[p.id]=p});
 var costPerOrder=function(o){var p=prodMap[o.product_id];if(!p)return 0;var prodCost=(Number(p.cost_product_usd||0)+Number(p.ship_cost_usd||0))*usd;return prodCost*(o.quantity||1)+Number(o.shipping_cost||0)};
 var deliveryDelay={queued:6,calling:5,confirmed:3,reschedule:4,no_answer:7};
 var today=new Date();today.setHours(0,0,0,0);
 var days=[];for(var i=0;i<30;i++)days.push({date:new Date(today.getTime()+i*DAY_MS),in:0,out:0,net:0,nb:0});
 var pendingTotal=0;
 (orders||[]).forEach(function(o){
  if(['delivered','returned','refused','cancelled','fake'].indexOf(o.status)>=0)return;
  var delay=deliveryDelay[o.status];if(!delay)return;
  var created=new Date(o.created_at||today);
  var deliveryDay=new Date(created.getTime()+delay*DAY_MS);
  var idx=Math.round((deliveryDay-today)/DAY_MS);
  if(idx<0)idx=0;if(idx>=30)return;
  var conv=o.status==='confirmed'?delivR:o.status==='reschedule'?confR*delivR*0.8:confR*delivR;
  var rev=Number(o.total_price||0)*conv;
  var cost=costPerOrder(o)*conv;
  days[idx].in+=rev;days[idx].out+=cost;days[idx].net+=(rev-cost);days[idx].nb+=conv;
  pendingTotal+=Number(o.total_price||0);
 });
 var recentKpis=(kpis||[]).filter(function(k){return daysSince(k.day)<=14});
 var dailyAdAvg=0;if(recentKpis.length){var totalAd=0;recentKpis.forEach(function(k){totalAd+=Number(k.ad_spend||0)});dailyAdAvg=(totalAd/recentKpis.length)*usd}
 if(scenario==='conservative')dailyAdAvg*=1.1;else if(scenario==='optimistic')dailyAdAvg*=0.9;
 days.forEach(function(d){d.out+=dailyAdAvg;d.net=d.in-d.out});
 var totalIn=0,totalOut=0,cum=0,minCum=0,minCumDay=-1;
 days.forEach(function(d,i){totalIn+=d.in;totalOut+=d.out;cum+=d.net;d.cum=cum;if(cum<minCum){minCum=cum;minCumDay=i}});
 var totalNet=totalIn-totalOut;
 var conf='med';if(orders.length>=30&&recentKpis.length>=7)conf='high';else if(orders.length<10||recentKpis.length<3)conf='low';
 return {days:days,totalIn:totalIn,totalOut:totalOut,totalNet:totalNet,pendingTotal:pendingTotal,dailyAdAvg:dailyAdAvg,conf:conf,minCum:minCum,minCumDay:minCumDay,confR:confR,delivR:delivR};
}

/* === PERFORMANCE === */
function viewPerf(){
 var profs=app.cache.profiles||[];var orders=app.cache.orders||[];var tests=app.cache.tests||[];var prods=app.cache.products||[];
 var head='<div class="pghead"><div><h1 class="pg">🏆 '+t('perfTitle')+'</h1><div class="sub">'+t('perfSub')+'</div></div></div>';
 var rows=profs.filter(function(p){return p.role!=='admin'}).map(function(p){
  var stats='';
  if(p.role==='confirmatrice'){
   var myOrders=orders.filter(function(o){return o.assignee_id===p.id});
   var conf=myOrders.filter(function(o){return o.status==='confirmed'||o.status==='delivered'}).length;
   var deliv=myOrders.filter(function(o){return o.status==='delivered'}).length;
   var cr=myOrders.length?Math.round(conf/myOrders.length*100):0;
   var dr=conf?Math.round(deliv/conf*100):0;
   stats='<span class="niche-chip">'+t('confirmRate')+': <b>'+cr+'%</b></span><span class="niche-chip">'+t('deliverRate')+': <b>'+dr+'%</b></span><span class="niche-chip">'+t('ordersHandled')+': <b>'+myOrders.length+'</b></span>';
  } else if(p.role==='media_buyer'){
   var myTests=tests.filter(function(tx){return tx.tester_id===p.id});
   var validated=myTests.filter(function(tx){return tx.verdict==='validate'}).length;
   var avgM=myTests.length?Math.round(myTests.reduce(function(a,b){return a+Number(b.calculated_margin||0)},0)/myTests.length):0;
   stats='<span class="niche-chip">Tests: <b>'+myTests.length+'</b></span><span class="niche-chip">'+t('productsValidated')+': <b>'+validated+'</b></span><span class="niche-chip">'+t('marginAvg')+': <b>'+fmt(avgM)+' '+t('cur')+'</b></span>';
  } else if(p.role==='sourcing'){
   var myP=prods.filter(function(x){return x.created_by===p.id});
   var val=myP.filter(function(x){return ['validated','scaling','live','production'].indexOf(x.current_stage)>=0}).length;
   var pct=myP.length?Math.round(val/myP.length*100):0;
   var avgS=myP.length?(myP.reduce(function(a,b){return a+Number(b.final_score||0)},0)/myP.length).toFixed(1):'0.0';
   stats='<span class="niche-chip">Soumis: <b>'+myP.length+'</b></span><span class="niche-chip">'+t('productsValidated')+': <b>'+val+' ('+pct+'%)</b></span><span class="niche-chip">Note moyenne: <b>'+avgS+'/10</b></span>';
  } else {
   stats='<span class="niche-chip">Role: '+t('r_'+p.role)+'</span>';
  }
  return '<div class="card" style="padding:13px;margin-bottom:9px;display:flex;align-items:center;gap:12px"><div class="who"><div class="av">'+esc((p.full_name||'?').charAt(0).toUpperCase())+'</div></div><div style="flex:1"><b>'+esc(p.full_name||'-')+'</b> <span style="font-size:11px;color:var(--ink2)">'+t('r_'+p.role)+'</span><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">'+stats+'</div></div></div>';
 }).join('');
 return head+(rows||'<div class="empty">'+t('empty')+'</div>');
}

function aggKpis(){var m={};(app.cache.kpis||[]).forEach(function(k){if(!k.product_id)return;var a=m[k.product_id]||(m[k.product_id]={product_id:k.product_id,orders:0,confirmed:0,delivered:0,returned:0,revenue:0,ad_spend:0});a.orders+=k.orders;a.confirmed+=k.confirmed;a.delivered+=k.delivered;a.returned+=k.returned;a.revenue+=Number(k.revenue);a.ad_spend+=Number(k.ad_spend)});return Object.keys(m).map(function(k){return m[k]})}
function signalOf(a){var dr=a.confirmed>0?a.delivered/a.confirmed:0;var net=a.revenue-a.ad_spend;var cr=a.orders>0?a.confirmed/a.orders:0;if(dr>=0.5&&net>0)return'scale';if(cr<0.4||net<=0)return'watch';return'test'}
function viewKpis(){
 var pname={};(app.cache.products||[]).forEach(function(p){pname[p.id]=p.name});var aggs=aggKpis();
 var head='<div class="pghead"><div><h1 class="pg">📈 '+t('kpis')+'</h1></div></div>';
 var imp='<div class="card" style="padding:14px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:3px">📑 '+t('importCsv')+'</div><div class="note">'+t('csvHint')+'</div><div class="row2"><label class="btn btn-p" style="cursor:pointer">'+t('selectCsv')+'<input type="file" accept=".csv" style="display:none" onchange="importCsv(this)"></label><button class="btn btn-g" onclick="downloadTemplate()">⬇ '+t('template')+'</button></div>'+(app.kpimsg?'<div style="margin-top:10px;background:var(--soft);color:var(--brand);border-radius:8px;padding:7px 10px;font-size:12.5px">'+esc(app.kpimsg)+'</div>':'')+'</div>';
 if(!aggs.length)return head+imp+'<div class="empty">'+t('empty')+'</div>';
 var maxNet=Math.max.apply(null,aggs.map(function(a){return Math.abs(a.revenue-a.ad_spend)}).concat([1]));
 var bars=aggs.slice().sort(function(x,y){return (y.revenue-y.ad_spend)-(x.revenue-x.ad_spend)}).map(function(a){var net=a.revenue-a.ad_spend;var col=net>0?'#16a34a':'#dc2626';return '<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px"><span style="font-weight:600">'+esc(pname[a.product_id]||'-')+'</span><span style="font-weight:700;color:'+col+'">'+fmt(net)+' '+t('cur')+'</span></div><div class="bar"><div style="width:'+Math.round(Math.abs(net)/maxNet*100)+'%;background:'+col+'"></div></div></div>'}).join('');
 var rows=aggs.map(function(a){var cr=a.orders>0?Math.round(a.confirmed/a.orders*100):0;var dr=a.confirmed>0?Math.round(a.delivered/a.confirmed*100):0;var net=a.revenue-a.ad_spend;var s=signalOf(a);var sc=s==='scale'?'b-validated':s==='watch'?'b-killed':'b-research';return '<tr><td style="font-weight:700">'+esc(pname[a.product_id]||'-')+'</td><td style="text-align:end">'+fmt(a.orders)+'</td><td style="text-align:end">'+cr+'%</td><td style="text-align:end">'+dr+'%</td><td style="text-align:end">'+fmt(a.revenue)+'</td><td style="text-align:end;font-weight:700;color:'+(net>0?'var(--good)':'var(--bad)')+'">'+fmt(net)+'</td><td><span class="badge '+sc+'">'+t('sig_'+s)+'</span></td></tr>'}).join('');
 return head+imp+'<div class="card" style="padding:14px;margin-bottom:14px"><div style="font-weight:700;margin-bottom:9px">'+t('netByP')+'</div>'+bars+'</div><div class="card scroll-x"><table><thead><tr><th>Produit</th><th style="text-align:end">'+t('orders')+'</th><th style="text-align:end">'+t('confRate')+'</th><th style="text-align:end">'+t('delivRate')+'</th><th style="text-align:end">'+t('revenue')+'</th><th style="text-align:end">'+t('net')+'</th><th>'+t('signal')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function modalWrap(title,body,action){return '<div class="modal" onclick="if(event.target===this)closeModal()"><div class="bx"><div class="mh"><b>'+title+'</b><button class="x" onclick="closeModal()">×</button></div><div class="mb">'+body+'</div><div class="mf"><button class="btn btn-g" onclick="closeModal()">'+t('cancel')+'</button><button class="btn btn-p" onclick="'+action+'" '+(app.busy?'disabled':'')+'>'+(app.busy?'<span class="spin"></span>':t('create'))+'</button></div></div></div>'}

/* === Init === */
async function init(){
 applyDir();applyDark();
 try{
  var s=await SB.auth.getSession();app.session=s.data.session;
  if(app.session){await loadProfile();await loadSettings();await loadNotifs()}
  render();
  if(app.session)afterLogin();
 }catch(e){console.error(e);render()}
 SB.auth.onAuthStateChange(async function(_e,sess){app.session=sess;if(sess){await loadProfile();await loadSettings();await loadNotifs();render();afterLogin()}else{app.profile=null;render()}});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(app.modal){closeModal()}else if(app.notifsOpen){app.notifsOpen=false;render()}}});
}
init();
</script>
